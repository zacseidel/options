# market — runtime configuration. Secrets live in .env, never here.

paths:
  db: data/market.duckdb
  state: data/state
  site_out: site/data
  smartmoney_repo: ../smartmoney          # ledgers read in place (decision D3)

polygon:
  base_url: https://api.massive.com
  max_concurrency: 16                     # paid plan: unlimited calls; keep requests polite
  timeout_seconds: 30
  max_retries: 4
  flatfiles_endpoint: https://files.massive.com
  flatfiles_bucket: flatfiles
  stocks_history_years: 5

benchmark: SPY

# Stock data is stored only for securities that were members of these universes at any time in
# the history window, plus watchlists and benchmarks (not the whole ~12k-ticker market).
tracked:
  universes: [sp500, sp400]
  watchlists: true
  benchmarks: [SPY, MDY, QQQ]
  # Old ticker → current ticker, for renames Polygon's reference data doesn't link.
  ticker_aliases:
    WLTW: WTW

options:
  # Options are gathered only for a select set of underlyings (decision D8). Each one costs
  # ~0.5 KB/day in the panel (~0.35 MB per 2 years), measured 2026-10-09.
  underlyings:
    watchlists: true                      # every watchlist with `options: true` (watchlists.yaml)
    # Names entering these strategy slots join the option set from that date (D10: categories whose
    # Sharpe beats SPY's). ~99 distinct names over the 2-year options window, measured 2026-10-09.
    category_slots: [mom12_sp500.top5, rankmom_sp500.top5, mom12_megacap.top5, laggards_mega10.top2.hold21]
    max_underlyings: 200                  # hard cap; additions beyond it are refused and reported
  # Option panel (PLAN §4): rows from the daily OPRA day-aggregates file are kept only for names
  # around the periods an option strategy holds them (entry − 10 days → exit + 5 days), and only
  # inside these bands. The bands are wide enough that a held contract usually stays inside after a
  # big move; a held contract with no bar that day is marked with Black-Scholes at its last IV.
  panel:
    history_days: 731                     # Options Starter: 2 years of flat files
    pad_before_days: 10
    pad_after_days: 5
    short_dte: [0, 60]                    # CSP / covered-call / diagonal short legs
    put_strike_pct: [0.60, 1.30]          # strike / spot
    call_strike_pct: [0.75, 1.40]
    leap_dte: [150, 800]
    leap_call_strike_pct: [0.40, 1.10]
    min_volume: 1
    workers: 6                            # parallel flat-file downloads
  # Fills (PLAN §2.4): sell at mid*(1-h), buy at mid*(1+h)
  haircut:
    base_pct: 0.03
    min_dollars: 0.05
    wide_dte: 180
    wide_abs_delta: 0.15
    wide_multiplier: 2.0
  liquidity:                              # a contract must have traded this much on the selection day
    min_volume: 10
    min_transactions: 3
    leap: {min_volume: 2, min_transactions: 1}   # long-dated calls trade thinly

evaluation:
  risk_free_rate: 0.04          # annual, for Sharpe/Sortino and alpha
  kelly_min_closed_trades: 20
  benchmarks: [SPY, MDY, QQQ]
  windows: {all: null, 3y: 3, 1y: 1}

# Newsfeed (site #/news): per report, what a portfolio following these strategies would buy, add, trim,
# sell or keep, reconciled across strategies at the stock level. `weight` = share of the portfolio given to
# each strategy (equal weight per position inside it). Edit freely; weights are normalized to 100%.
# Supported holds: while_listed and fixed_hold. The data file is encrypted when NEWSFEED_PASSWORD is set
# in .env (AES-GCM, key from PBKDF2-SHA256); the page asks for the password and decrypts in the browser.
newsfeed:
  reports: 16                   # report dates shown, newest first (the upcoming one included)
  min_change: 0.005             # weight changes smaller than this are shown as Hold
  portfolio:
    - {strategy: mom12si_sp500.top5,          weight: 0.25}   # S&P 500 Leaders, short-interest filter
    - {strategy: rankmom_sp500.top5,          weight: 0.15}   # S&P 500 Rank Momentum
    - {strategy: steady_sp500.top5,           weight: 0.10}   # S&P 500 Steady Leaders
    - {strategy: fmom_sp400.top5,             weight: 0.10}   # S&P 400 Fundamental Momentum
    - {strategy: emerging_sp400.top5,         weight: 0.10}   # S&P 400 Emerging Leaders
    - {strategy: laggards_mega10.top2.hold21, weight: 0.15}   # Megacap Laggards, 21-session lots
    - {strategy: divraise_sp900.all.hold126,  weight: 0.15}   # Dividend Raisers, 126-session lots
