# market — runtime configuration. Secrets live in .env, never here.

paths:
  db: data/market.duckdb
  state: data/state
  site_out: site/data
  smartmoney_repo: ../smartmoney          # ledgers read in place (decision D3)

polygon:
  base_url: https://api.polygon.io
  max_concurrency: 16                     # paid plan: unlimited calls; keep requests polite
  timeout_seconds: 30
  max_retries: 4
  flatfiles_endpoint: https://files.polygon.io
  flatfiles_bucket: flatfiles
  stocks_history_years: 5

benchmark: SPY

options:
  # Option panel (PLAN §4): rows from the daily OPRA day-aggregates file are kept only if they
  # fall inside these bands. Changing bands requires a one-time re-stream of the flat files.
  panel:
    dte_min: 1
    dte_max: 800
    put_strike_pct: [0.60, 1.05]          # strike / spot
    call_strike_pct: [0.95, 1.40]
    leap_dte_min: 240
    leap_call_strike_pct: [0.40, 1.00]
  # Fills (PLAN §2.4): sell at mid*(1-h), buy at mid*(1+h)
  haircut:
    base_pct: 0.03
    min_dollars: 0.05
    wide_dte: 180
    wide_abs_delta: 0.15
    wide_multiplier: 2.0
  liquidity:
    min_volume: 10
    min_transactions: 3
